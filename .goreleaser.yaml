version: 2

builds:
  - main: cmd/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

changelog:
  sort: asc
  filters:
    exclude: []

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
    - goos: windows
      formats: [zip]

checksum:
  name_template: 'checksums.txt'

dockers_v2:
  - id: multiarch
    dockerfile: build/package/Dockerfile
    images:
      - ghcr.io/bankdata/styra-controller
    tags:
      - latest
      - "{{ .Major }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
  - id: amd64
    dockerfile: build/package/Dockerfile
    images:
      - ghcr.io/bankdata/styra-controller
    tags:
      - "{{ .Version }}-amd64"
    platforms:
      - linux/amd64
    disable: "{{ .IsSnapshot }}"
  - id: arm64
    dockerfile: build/package/Dockerfile
    images:
      - ghcr.io/bankdata/styra-controller
    tags:
      - "{{ .Version }}-arm64"
    platforms:
      - linux/arm64
    disable: "{{ .IsSnapshot }}"

release:
  github:
    owner: Bankdata
    name: styra-controller
  footer: |
    ## Docker Image
    - `ghcr.io/bankdata/styra-controller:{{ .Version }}`
